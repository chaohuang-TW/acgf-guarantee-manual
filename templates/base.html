<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="忠實呈現農業信用保證業務作業手冊（{{EDITION}}）{{VERSION_LABEL}}版本的公開資料數位閱讀版。">
  <meta name="theme-color" content="#183f35">
  <script>document.documentElement.classList.toggle("has-search-query", Boolean(new URLSearchParams(location.search).get("q")));</script>
  <title>{{TITLE}}</title>
  <link rel="canonical" href="{{CANONICAL}}">
  <link rel="icon" href="{{ASSET_PREFIX}}assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{ASSET_PREFIX}}assets/css/site.css">
  <script src="{{ASSET_PREFIX}}assets/js/search.js" defer></script>
  <script src="{{ASSET_PREFIX}}assets/js/site.js" defer></script>
</head>
<body data-site-root="{{SITE_ROOT}}" data-search-index="{{SEARCH_INDEX}}">
  <a class="skip-link" href="#main-content">跳到主要內容</a>
  <div class="identity-notice" role="note"><span>本網站為公開資料數位閱讀版，非農業信用保證基金官方網站。</span><span>正式內容以原始PDF、後續函釋及公告為準。</span></div>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{HOME_URL}}">
        <span>農業信用保證業務作業手冊</span>
        <small>{{EDITION}}｜公開資料數位閱讀版</small>
      </a>
      <details class="global-menu">
        <summary>全站導覽</summary>
        <nav aria-label="主要導覽">
        <a href="{{SEARCH_URL}}">全文搜尋</a>
        <a href="{{VERSION_URL}}">完整目錄</a>
        <a href="{{FORMS_URL}}" data-nav="forms">書表</a>
        <a href="{{APPENDICES_URL}}">附錄與查索表</a>
        <a href="{{VERSIONS_URL}}">版本與來源</a>
        <a href="{{PDF_URL}}" target="_blank" rel="noopener noreferrer">開啟完整PDF ↗</a>
        </nav>
      </details>
    </div>
  </header>
  {{MAIN}}
  {{READING_TOOLS}}
  <footer class="site-footer">
    <div class="footer-grid">
      <section>
        <h2>版本與來源</h2>
        <p>資料版本：{{VERSION_LABEL}}</p>
        <p><a href="{{VERSIONS_URL}}">版本紀錄</a></p>
        <p>來源文件：財團法人農業信用保證基金《保證業務作業手冊（{{EDITION}}）》</p>
      </section>
      <section>
        <h2>身分與隱私說明</h2>
        <p>本網站不是農業信用保證基金官方網站。全文搜尋於使用者瀏覽器內完成，不會將查詢內容傳送至外部服務。</p>
      </section>
    </div>
  </footer>
</body>
</html>
